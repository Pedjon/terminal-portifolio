<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Portfolio - Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal">
        <div id="shutdown-screen" class="shutdown-screen" role="status" hidden></div>
        <div class="terminal-header">
            <span class="terminal-title">pedro@portfolio:~</span>
            <a id="website-link" href="__WEBSITE_URL__"><span id="website-label">Website portfolio</span><span aria-hidden="true"> ↗</span></a>
        </div>
        <div class="terminal-body">
            <div id="output"></div>
            <div class="input-line">
                <span class="prompt">guest@portfolio:~$</span>
                <input type="text" id="input" aria-label="Terminal command" autofocus autocomplete="off" spellcheck="false">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lokijs@1.5.12/src/lokijs.min.js"></script>
    <script type="module" src="assets/scripts/init-terminal.js"></script>
</body>
</html>
